# ============================================================
# 母婴亲子 SaaS - 宝塔 Nginx 站点配置
# 域名：quantaida.cloud / *.quantaida.cloud
# 要求：仅 IPv4 监听，不添加 IPv6（不要出现 listen [::]:443）
# 放置：宝塔面板 -> 网站 -> 设置 -> 配置文件
# ============================================================

upstream mc_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    server_name quantaida.cloud www.quantaida.cloud admin.quantaida.cloud app.quantaida.cloud api.quantaida.cloud *.quantaida.cloud;

    # 仅保留 ACME 验证与跳转，避免明文业务流量
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/mc-saas/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- PC 品牌官网 ----------
server {
    listen 443 ssl;
    server_name quantaida.cloud www.quantaida.cloud;

    ssl_certificate     /www/server/panel/vhost/cert/quantaida.cloud/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/quantaida.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root  /www/wwwroot/mc-saas/site/dist;
    index index.html;
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://mc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Code     $http_x_tenant_code;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    location /files/ {
        alias /www/wwwroot/mc-saas/backend/data/storage/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

