server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name maternal-child-admin.quantaida.cloud;
    root /www/wwwroot/maternal-child-admin.quantaida.cloud;
    index index.html;
    charset utf-8;

    ssl_certificate     /www/server/panel/vhost/cert/maternal-child-admin.quantaida.cloud/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/maternal-child-admin.quantaida.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log  /www/wwwlogs/maternal-child-admin.quantaida.cloud.log;
    error_log   /www/wwwlogs/maternal-child-admin.quantaida.cloud.error.log;
}
